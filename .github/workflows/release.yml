name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: The version to release, as MAJOR.MINOR.PATCH; the version on main when empty
        required: false
        type: string
      draft:
        description: Publish a draft of the schema package from main instead of releasing
        required: false
        type: boolean
        default: false
  push:
    tags: ["v*"]

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: github.event_name == 'workflow_dispatch' && !inputs.draft
    runs-on: ubuntu-latest
    steps:
      - if: github.ref != 'refs/heads/main'
        run: |
          echo "releases are cut from main, not ${GITHUB_REF_NAME}" >&2
          exit 1
      - id: app
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.OVAL_SPEC_RELEASE_APP_ID }}
          private-key: ${{ secrets.OVAL_SPEC_RELEASE_APP_PRIVATE_KEY }}
      - uses: actions/checkout@v7
        with:
          token: ${{ steps.app.outputs.token }}
          fetch-depth: 0
      - uses: jdx/mise-action@v5
      - name: Validate the request
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          REQUESTED: ${{ inputs.version }}
        run: |
          current="$(node -p "require('./package.json').version")"
          version="${REQUESTED:-$current}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "$version is not MAJOR.MINOR.PATCH" >&2
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/v$version" >/dev/null; then
            echo "v$version is already released" >&2
            exit 1
          fi
          latest="$(git tag --list 'v*' | sort -V | tail -1)"
          if [ -n "$latest" ] && ! node -e 'const [a, b] = process.argv.slice(1).map((v) => v.split(".").map(Number)); process.exit((a[0] - b[0] || a[1] - b[1] || a[2] - b[2]) > 0 ? 0 : 1)' "$version" "${latest#v}"; then
            echo "$version is not greater than the latest release ${latest#v}" >&2
            exit 1
          fi
          runs="$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/check-runs" --paginate --jq '.check_runs[] | select(.name != "release") | "\(.name): \(.status) \(.conclusion)"')"
          if [ -z "$runs" ]; then
            echo "no checks have run on $GITHUB_SHA" >&2
            exit 1
          fi
          echo "$runs"
          if echo "$runs" | grep -vE ': completed (success|skipped|neutral)$'; then
            echo "checks on $GITHUB_SHA are not all green" >&2
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - name: Check the tree
        run: mise run ci
      - name: Prepare the edition
        run: |
          mise run set-version "$VERSION"
          npm run release
          npm run build
          npm run check
      - name: Commit and push
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          APP_SLUG: ${{ steps.app.outputs.app-slug }}
        run: |
          id="$(gh api "users/${APP_SLUG}[bot]" --jq .id)"
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${id}+${APP_SLUG}[bot]@users.noreply.github.com"
          git add package.json package-lock.json packages/oval-schema/package.json published
          git commit -m "Release $VERSION"
          git push origin HEAD:main
      - name: Create the release
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run:
          gh release create "v$VERSION" --target "$(git rev-parse HEAD)" --title "v$VERSION" --notes
          ""

  publish:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
      - run: npm ci
      - run: mise run version:check
      - run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "the version is $version but the tag is $GITHUB_REF_NAME" >&2
            exit 1
          fi
      - run: npm run check --workspace packages/oval-schema
      - run: npm publish --workspace packages/oval-schema

  draft:
    if: github.event_name == 'workflow_dispatch' && inputs.draft
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - if: github.ref != 'refs/heads/main'
        run: |
          echo "drafts are published from main, not ${GITHUB_REF_NAME}" >&2
          exit 1
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
      - run: npm ci
      - name: Check that main is green
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          runs="$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/check-runs" --paginate --jq '.check_runs[] | select(.name != "draft") | "\(.name): \(.status) \(.conclusion)"')"
          if [ -z "$runs" ]; then
            echo "no checks have run on $GITHUB_SHA" >&2
            exit 1
          fi
          echo "$runs"
          if echo "$runs" | grep -vE ': completed (success|skipped|neutral)$'; then
            echo "checks on $GITHUB_SHA are not all green" >&2
            exit 1
          fi
      - name: Choose the draft version
        run: |
          base="$(node -p "require('./package.json').version")"
          published="$(npm view @oval-vote/oval-schema versions --json 2>/dev/null || echo '[]')"
          next="$(node -e 'const [base, published] = process.argv.slice(1); const drafts = JSON.parse(published).flatMap((v) => { const m = v.match(new RegExp(`^${base.replace(/\./g, "\\.")}-draft\\.(\\d+)$`)); return m ? [Number(m[1])] : []; }); console.log(Math.max(0, ...drafts) + 1)' "$base" "$published")"
          echo "DRAFT_VERSION=$base-draft.$next" >> "$GITHUB_ENV"
      - name: Publish the draft
        env:
          OVAL_SCHEMA_ID: https://spec.oval.vote/draft/schema/oval.schema.json
        run: |
          npm version "$DRAFT_VERSION" --no-git-tag-version --workspace packages/oval-schema
          npm run check --workspace packages/oval-schema
          npm publish --workspace packages/oval-schema --tag draft
          echo "published @oval-vote/oval-schema@$DRAFT_VERSION under the draft tag"
