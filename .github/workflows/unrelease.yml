name: Unrelease

on:
  workflow_dispatch:
    inputs:
      version:
        description:
          The version to withdraw, as MAJOR.MINOR.PATCH; only the latest release can be withdrawn
        required: true
        type: string

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  unrelease:
    runs-on: ubuntu-latest
    steps:
      - if: github.ref != 'refs/heads/main'
        run: |
          echo "releases are withdrawn from main, not ${GITHUB_REF_NAME}" >&2
          exit 1
      - id: app
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.OVAL_SPEC_RELEASE_APP_ID }}
          private-key: ${{ secrets.OVAL_SPEC_RELEASE_APP_PRIVATE_KEY }}
      - uses: actions/checkout@v7
        with:
          token: ${{ steps.app.outputs.token }}
          fetch-depth: 0
      - name: Validate the request
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          VERSION: ${{ inputs.version }}
        run: |
          latest="$(gh release list --limit 1 --json tagName --jq '.[0].tagName')"
          if [ "$latest" != "v$VERSION" ]; then
            echo "v$VERSION is not the latest release (${latest:-none})" >&2
            exit 1
          fi
          commit="$(git rev-parse "v$VERSION^{commit}")"
          if ! git merge-base --is-ancestor "$commit" HEAD; then
            echo "the release commit $commit is not on main" >&2
            exit 1
          fi
          if [ -z "$(git show --format= --name-only "$commit" -- "published/v$VERSION")" ]; then
            echo "the release commit $commit did not add published/v$VERSION" >&2
            exit 1
          fi
          if git log --format=%s "$commit..HEAD" | grep -qE '^Release [0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "a later release commit exists on main" >&2
            exit 1
          fi
          echo "commit=$commit" >> "$GITHUB_ENV"
      - name: Revert the release commit
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          VERSION: ${{ inputs.version }}
          APP_SLUG: ${{ steps.app.outputs.app-slug }}
        run: |
          id="$(gh api "users/${APP_SLUG}[bot]" --jq .id)"
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${id}+${APP_SLUG}[bot]@users.noreply.github.com"
          git revert --no-edit --no-commit "$commit"
          git commit -m "Unrelease $VERSION"
          git push origin HEAD:main
      - name: Delete the release and its tag
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          VERSION: ${{ inputs.version }}
        run: gh release delete "v$VERSION" --yes --cleanup-tag
